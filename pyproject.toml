[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lucena-backend"
version = "0.1.0"
description = "Lucena backend — orchestrator + state machine + LLM adapter (closed)"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2",   # Postgres durable store
    "grpcio>=1.60",           # engine gRPC client
    "protobuf>=4.0",          # generated stubs
    "fastapi>=0.110",         # WS/REST server
    "uvicorn>=0.29",          # ASGI server
    "websockets>=12.0",       # WS
    "argon2-cffi>=23.1",      # password hashing (argon2id; bcrypt truncates at 72 bytes)
]                             # lucena-engine is installed from the sibling engine/ (editable)

[project.optional-dependencies]
dev = ["pytest>=8.0", "python-chess>=1.10", "httpx>=0.27"]   # tests/tooling only
                              # httpx: starlette.testclient imports it at construction — without
                              # it every TestClient test errors out, so it is a hard test dep.
gemini = ["google-genai>=1.0"]                # the GeminiAdapter provider (lazy-imported)

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs big downloads or long engine runs",
    "engine: needs a Stockfish binary",
]
